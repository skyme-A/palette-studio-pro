services:
  - type: web
    name: palette-studio-pro
    runtime: python
    buildCommand: "cd client && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "uvicorn server.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
